[package]
name = "sinsemilla"
version = "0.2.0"
authors = [
    "Jack Grigg <jack@zodl.com>",
    "Kris Nuttycombe <kris@zodl.com>",
    "Ying Tong Lai",
]
edition = "2024"
rust-version = "1.88"
description = "A collision-resistant circuit-efficient hash function"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zcash/sinsemilla"
categories = ["cryptography"]

# docs.rs builds with no features by default, hiding the `runtime-precomputation`
# tables and `test-dependencies` constructors. `--cfg docsrs` turns on the
# `doc_cfg` feature gate in `lib.rs`, so the items those features add are labelled with
# the feature that provides them.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
group = "0.14"
pasta_curves = { version = "0.6", default-features = false, features = ["alloc"] }
subtle = { version = "2.3", default-features = false }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
rand = "0.10"

[features]
# Zebra builds sinsemilla with default features and can't name `merkle-table` without
# breaking `cargo publish` against crates.io releases, which lack the feature.
default = ["merkle-table"]
std = []
runtime-precomputation = ["std"]
# Guarantee coverage of the Orchard Merkle hash, including its exceptional-case checks.
merkle-table = ["runtime-precomputation"]
test-dependencies = []

[[bench]]
name = "sinsemilla"
harness = false

[patch.crates-io]
# pasta_curves combined/20261117: zcash/pasta_curves main + #187 #189 #186 #195 #188 #194 #183.
pasta_curves = { git = "https://github.com/upbqdn/pasta_curves", rev = "95df6839da3dd8e5588bb547f63ac26575f1037e" }
